org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental-compilation cache tries to compute a relative path
# between the project (D:) and plugin sources cached under pub-cache (C:);
# relativizing across drive letters on Windows throws
# "this and base files have different roots". Disabling incremental
# compilation avoids that path entirely — this only affects build speed,
# not app behavior.
kotlin.incremental=false
