name: cantae
description: Local-first Flutter app for synchronized vocal group rehearsal.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  just_audio: ^0.9.39
  audio_service: ^0.18.13
  audio_session: ^0.1.21
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  crypto: ^3.0.3
  nsd: ^3.0.0
  cryptography: ^2.7.0
  go_router: ^18.1.4
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
  drift_dev: ^2.21.0
  build_runner: ^2.4.12
  nsd_platform_interface: ^2.2.0
  just_audio_platform_interface: ^4.6.0
  plugin_platform_interface: ^2.1.8
  collection: ^1.19.1
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/geist/Geist-Bold.ttf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/geist_mono/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/geist_mono/GeistMono-Medium.ttf
          weight: 500
