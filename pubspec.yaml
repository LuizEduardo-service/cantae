name: cantae
description: Local-first Flutter app for synchronized vocal group rehearsal.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  just_audio: ^0.9.39
  audio_service: ^0.18.13
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  crypto: ^3.0.3
  nsd: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
  drift_dev: ^2.21.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
